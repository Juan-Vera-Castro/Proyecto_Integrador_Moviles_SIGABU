# HTTPS de SIGABU: Apache recibe a los usuarios y le pasa las peticiones al contenedor.
<VirtualHost *:443>
    ServerName 192.168.10.67

    SSLEngine on
    SSLCertificateFile /etc/ssl/sigabu/sigabu.crt
    SSLCertificateKeyFile /etc/ssl/sigabu/sigabu.key

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
</VirtualHost>
