; Ajustes de PHP para SIGABU en el contenedor
memory_limit = 256M
upload_max_filesize = 110M
post_max_size = 120M
expose_php = Off
date.timezone = America/Bogota

; OPcache: el código no cambia dentro de la imagen, así que no se revisan los archivos en cada petición
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
